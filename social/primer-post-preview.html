<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Primer post - Haircut & Chill</title>
    <style>
      :root {
        --ink: #12100d;
        --charcoal: #1a1713;
        --ivory: #fbf4e9;
        --muted: rgba(251, 244, 233, 0.72);
        --amber: #c99354;
        --gold: #e1b06e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #0e0c0a;
        display: grid;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 32px;
      }

      .post {
        aspect-ratio: 4 / 5;
        background:
          linear-gradient(180deg, rgba(18, 16, 13, 0.7) 0%, rgba(18, 16, 13, 0.08) 44%, rgba(18, 16, 13, 0.92) 100%),
          linear-gradient(90deg, rgba(18, 16, 13, 0.45), rgba(18, 16, 13, 0.05) 52%, rgba(18, 16, 13, 0.24)),
          url("../public/assets/instagram/juanse-process-main.png") center / cover;
        color: var(--ivory);
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: min(92vh, 1350px);
        overflow: hidden;
        padding: 76px;
        position: relative;
        width: min(73.6vh, 1080px);
      }

      .post::after {
        background: linear-gradient(104deg, transparent 0%, rgba(225, 176, 110, 0.12) 48%, transparent 72%);
        content: "";
        filter: blur(12px);
        inset: 0;
        opacity: 0.46;
        pointer-events: none;
      }

      .brand,
      .content {
        position: relative;
        z-index: 1;
      }

      .brand h1 {
        font-size: 42px;
        line-height: 1;
        margin: 0;
        text-transform: uppercase;
      }

      .brand p {
        color: var(--muted);
        font-size: 30px;
        line-height: 1.2;
        margin: 8px 0 0;
      }

      .rule {
        background: linear-gradient(90deg, var(--gold), rgba(225, 176, 110, 0));
        height: 8px;
        margin-top: 24px;
        width: 142px;
      }

      .content {
        align-self: end;
        max-width: 880px;
      }

      .eyebrow {
        color: var(--gold);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.12em;
        margin: 0 0 18px;
        text-transform: uppercase;
      }

      .headline {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 98px;
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.92;
        margin: 0;
        max-width: 830px;
      }

      .text {
        color: rgba(251, 244, 233, 0.86);
        font-size: 34px;
        line-height: 1.28;
        margin: 26px 0 0;
        max-width: 820px;
      }

      .site {
        align-items: center;
        display: flex;
        gap: 18px;
        margin-top: 40px;
      }

      .site::before {
        background: var(--amber);
        content: "";
        height: 3px;
        width: 96px;
      }

      .site span {
        color: var(--ivory);
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
      }

      @media (max-width: 760px) {
        body {
          padding: 0;
        }

        .post {
          height: auto;
          min-height: 100vh;
          padding: 42px 28px;
          width: 100vw;
        }

        .brand h1 {
          font-size: 25px;
        }

        .brand p {
          font-size: 19px;
        }

        .headline {
          font-size: 58px;
        }

        .text,
        .site span {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <article class="post" aria-label="Post de presentacion Haircut and Chill">
      <header class="brand">
        <h1>Haircut & Chill</h1>
        <p>JuanSe Favoretti - Tandil</p>
        <div class="rule"></div>
      </header>

      <section class="content">
        <p class="eyebrow">Peluqueria en Tandil</p>
        <h2 class="headline">Donde el corte relaja</h2>
        <p class="text">Corte, barba, cejas, peinados y detalles con linea propia.</p>
        <div class="site">
          <span>hcpeluqueria.com</span>
        </div>
      </section>
    </article>
  </body>
</html>
